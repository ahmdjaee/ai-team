[package]
name = "ai-team-desktop"
version = "0.1.0"
description = "Jendela desktop untuk AI Team: membuka layanan AI Team yang sudah berjalan"
edition = "2021"
rust-version = "1.77.2"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
